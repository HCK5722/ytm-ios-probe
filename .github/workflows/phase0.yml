name: Phase 0 iOS Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase0:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      YT_COOKIE: ${{ secrets.YT_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          java -version

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and link Kotlin frameworks
        run: |
          chmod +x gradlew
          ./gradlew \
            :probe:linkDebugFrameworkIosArm64 \
            :probe:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace --info | tee gradle-build.log
          test -d probe/build/bin/iosArm64/debugFramework/YTMProbe.framework
          test -d probe/build/bin/iosSimulatorArm64/debugFramework/YTMProbe.framework
          echo "PROBE_1_DEPENDENCY_AND_LINK=PASS"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS test host
        working-directory: iosProbe
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; names=[x["name"] for runtime in d.values() for x in runtime if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(names[0] if names else "")')
          test -n "$DEVICE"
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Start loopback-only bgutil PoToken service
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider:2.0.0-node > /dev/null 2>&1
          docker run --detach --rm --name ytm-probe-bgutil \
            --log-driver none \
            --publish 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.0-node \
            > /dev/null
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:4416/ping > /dev/null; then
              echo "PROBE_TOKEN_SERVICE=PASS bind=127.0.0.1:4416 version=2.0.0"
              exit 0
            fi
            sleep 2
          done
          echo "PROBE_TOKEN_SERVICE=FAIL reason=health_timeout"
          exit 1

      - name: Run iOS simulator assertions
        run: |
          set -o pipefail
          trap 'docker stop ytm-probe-bgutil > /dev/null 2>&1 || true' EXIT
          set +e
          PROBE_TOKEN_GROUP=2a xcodebuild test \
            -project iosProbe/YTMProbeHost.xcodeproj \
            -scheme YTMProbeHost \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -resultBundlePath PhaseTwoA.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-2a-private.log \
            | grep -oE 'PROBE_[A-Z0-9_]+=.*|PROBE_TOKEN .*|PROBE_DIAG_(SUMMARY|RUN) .*' | tee xcodebuild-2a.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          rm -f xcodebuild-2a-private.log
          exit "$status"

      - name: Publish probe summary
        if: always()
        run: |
          : > safe-probe.log
          grep -E 'PROBE_[A-Z0-9_]+=' xcodebuild-2a.log >> safe-probe.log 2>/dev/null || true
          grep -E 'PROBE_TOKEN ' xcodebuild-2a.log >> safe-probe.log 2>/dev/null || true
          grep -E 'PROBE_DIAG_(SUMMARY|RUN) ' xcodebuild-2a.log >> safe-probe.log 2>/dev/null || true
          grep -E 'PROBE_1_DEPENDENCY_AND_LINK' gradle-build.log >> safe-probe.log 2>/dev/null || true
          {
            echo '## Phase 2a probe markers'
            echo '```text'
            cat safe-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-probe-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            safe-probe.log

      - name: Stop loopback-only bgutil service
        if: always()
        run: docker stop ytm-probe-bgutil > /dev/null 2>&1 || true
