name: Phase 0 iOS Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase0:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      YT_COOKIE: ${{ secrets.YT_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          java -version

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and link Kotlin frameworks
        run: |
          chmod +x gradlew
          ./gradlew \
            :probe:linkDebugFrameworkIosArm64 \
            :probe:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace --info | tee gradle-build.log
          test -d probe/build/bin/iosArm64/debugFramework/YTMProbe.framework
          test -d probe/build/bin/iosSimulatorArm64/debugFramework/YTMProbe.framework
          echo "PROBE_1_DEPENDENCY_AND_LINK=PASS"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS test host
        working-directory: iosProbe
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; names=[x["name"] for runtime in d.values() for x in runtime if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(names[0] if names else "")')
          test -n "$DEVICE"
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Run iOS simulator assertions
        run: |
          set -o pipefail
          xcodebuild test \
            -project iosProbe/YTMProbeHost.xcodeproj \
            -scheme YTMProbeHost \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -resultBundlePath PhaseZero.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Publish probe summary
        if: always()
        run: |
          {
            echo '## Phase 0 probe markers'
            echo '```text'
            grep -E 'PROBE_[0-9_]+|PROBE_DIAGNOSTIC' xcodebuild.log 2>/dev/null || true
            grep -E 'PROBE_1_DEPENDENCY_AND_LINK' gradle-build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-probe-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            gradle-build.log
            xcodebuild.log
            PhaseZero.xcresult
