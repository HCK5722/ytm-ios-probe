name: YTMProbeHost
options:
  bundleIdPrefix: io.github.hck5722
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    ENABLE_PREVIEWS: NO
targets:
  YTMProbeHost:
    type: application
    platform: iOS
    sources:
      - Host
    info:
      path: Host/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
    dependencies:
      - framework: ../probe/build/bin/iosArm64/releaseFramework/YTMProbe.framework
        embed: false
      - framework: ../innertube-kmp/build/bin/iosArm64/releaseFramework/YTMKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hck5722.ytmprobe.host
        FRAMEWORK_SEARCH_PATHS: "$(inherited) ../probe/build/bin/iosArm64/releaseFramework ../innertube-kmp/build/bin/iosArm64/releaseFramework"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos
        ARCHS: arm64
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ENABLE_PREVIEWS: NO
  YTMProbeHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: YTMProbeHost
      - framework: ../probe/build/bin/iosSimulatorArm64/debugFramework/YTMProbe.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hck5722.ytmprobe.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  YTMProbeHost:
    build:
      targets:
        YTMProbeHost: all
        YTMProbeHostTests: [test]
    test:
      gatherCoverageData: false
      environmentVariables:
        PROBE_TOKEN_GROUP: "2a"
      targets:
        - YTMProbeHostTests
